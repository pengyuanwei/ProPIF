robot_cfg:
  kinematics:
    use_usd_kinematics: false
    # Change to ${Path_to_project}/Propif/models/panda_description/panda.urdf
    urdf_path: "/home/pengyuan/projects/mobile-levitator/ProPIF/models/panda_description/levi_panda.urdf"
    asset_root_path: "panda_description"

    base_link: "panda_link0"
    ee_link: "levitator"
    
    # Add collision link configuration
    collision_link_names: null
    collision_spheres: null
    collision_sphere_buffer: 0.005
    extra_collision_spheres: {}
    
    # Self-collision configuration
    use_global_cumul: true
    self_collision_ignore:
      {
        "panda_link0": ["panda_link1", "panda_link2"],
        "panda_link1": ["panda_link2", "panda_link3", "panda_link4"],
        "panda_link2": ["panda_link3", "panda_link4"],
        "panda_link3": ["panda_link4", "panda_link6"],
        "panda_link4": ["panda_link5", "panda_link6", "panda_link7"],
        "panda_link5": ["panda_link6", "panda_link7"],
        "panda_link6": ["panda_link7"],
        "panda_link7": ["levitator"],
      }

    self_collision_buffer:
      {
        "panda_link0": 0.1,
        "panda_link1": 0.05,
        "panda_link2": 0.0,
        "panda_link3": 0.0,
        "panda_link4": 0.0,
        "panda_link5": 0.0,
        "panda_link6": 0.0,
        "panda_link7": 0.0,
        "levitator": 0.01
      }
    
    # Mesh configuration
    mesh_link_names:
      [
        "panda_link0",
        "panda_link1",
        "panda_link2",
        "panda_link3",
        "panda_link4",
        "panda_link5",
        "panda_link6",
        "panda_link7",
        "levitator"
      ]  

    cspace:
      joint_names: ["panda_joint1","panda_joint2","panda_joint3","panda_joint4","panda_joint5","panda_joint6","panda_joint7"]
      retract_config: [0.0, -1.3, 0.0, -2.5, 0.0, 1.0, 0.]
      null_space_weight: [1,1,1,1,1,1,1]
      cspace_distance_weight: [1,1,1,1,1,1,1]
      max_acceleration: 15.0
      max_jerk: 500.0
